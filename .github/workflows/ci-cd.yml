name: CI/CD Laravel HumBox

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: humbox
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP, Composer y extensiones
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_pgsql, fileinfo
          coverage: none

      - name: Instalar dependencias con Composer
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generar autoload de Composer
        run: composer dump-autoload

      - name: Copiar archivo .env
        run: cp .env.example .env

      - name: Configurar clave de aplicación
        run: php artisan key:generate

      - name: Sobrescribir .env para usar PostgreSQL en tests
        run: |
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=humbox" >> .env
          echo "DB_USERNAME=postgres" >> .env
          echo "DB_PASSWORD=1234" >> .env

      - name: Esperar que PostgreSQL esté listo
        run: sleep 15

      - name: Ejecutar migraciones y seeders
        run: php artisan migrate --seed

      - name: Limpiar cachés de configuración
        run: |
          php artisan config:clear
          php artisan config:cache

      - name: Ejecutar pruebas con PHPUnit
        run: vendor/bin/phpunit --testdox

      - name: Mostrar mensaje de finalización
        run: echo "Pipeline ejecutado correctamente en rama 'dev'."
